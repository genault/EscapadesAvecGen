<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geneviève Nault — Guide-accompagnatrice</title>

<!-- Polices : Gabriola pour le nom (police Windows, avec un repli élégant pour les autres appareils) + EB Garamond pour le reste du texte -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tangerine:wght@700&display=swap" rel="stylesheet">

<style>
  :root{
    --creme:      #FAF4E9;
    --creme-clair:#FFFDF8;
    --marine:     #1F3A5C;
    --marine-doux:#4E6A87;
    --coucher:    #E88A4D;
    --corail:     #E2938C;
    --or:         #C9A24B;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--creme);
    font-family:'EB Garamond', Georgia, serif;
    color:var(--marine);
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
    min-height:100vh;
  }

  /* ===== Le "billet de voyage" qui contient toute la page ===== */
  .billet{
    width:100%;
    max-width:440px;
    background:var(--creme-clair);
    border:1px solid var(--marine);
    border-radius:20px;
    overflow:hidden;
  }

  /* ===== Bandeau horizon décoratif (inspiré du logo) ===== */
  .horizon{
    display:block;
    width:100%;
    height:auto;
  }

  /* ===== En-tête : logo + nom ===== */
  .entete{
    display:flex;
    align-items:center;
    gap:16px;
    padding:0 24px 20px;
    margin-top:-34px; /* le logo chevauche légèrement l'horizon, comme un tampon de voyage */
  }

  .logo{
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid var(--creme-clair);
    box-shadow:0 0 0 1px var(--marine);
    background:var(--creme-clair);
    flex-shrink:0;
  }

  .titre-bloc{ padding-top:34px; }

  .nom{
    font-family:'Gabriola','Tangerine','Segoe Script',cursive;
    font-size:2.3rem;
    line-height:1.05;
    color:var(--marine);
    margin:0;
  }

  .metier{
    display:block;
    font-family:'EB Garamond', Georgia, serif;
    font-style:italic;
    font-size:0.95rem;
    letter-spacing:0.04em;
    color:var(--marine-doux);
    margin-top:2px;
  }

  /* ===== Séparateur pointillé, comme une perforation de billet ===== */
  .perforation{
    border:none;
    border-top:1.5px dashed var(--marine-doux);
    opacity:0.5;
    margin:0 24px;
  }

  /* ===== Liste des liens ===== */
  .liens{
    list-style:none;
    margin:0;
    padding:8px 12px 4px;
  }

  .liens li + li .lien{
    border-top:1.5px dashed rgba(31,58,92,0.25);
  }

  .lien{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 12px;
    text-decoration:none;
    color:var(--marine);
    border-radius:14px;
    transition:background-color 0.15s ease;
  }

  .lien:hover,
  .lien:focus-visible{
    background:#FBEADB;
  }

  .lien:focus-visible{
    outline:2px solid var(--coucher);
    outline-offset:-2px;
  }

  .badge{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1.5px solid var(--marine);
    background:var(--creme-clair);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .badge svg{
    width:22px;
    height:22px;
  }

  .texte-lien{ min-width:0; }

  .titre-lien{
    display:block;
    font-size:1.08rem;
    font-weight:500;
    color:var(--marine);
  }

  .sous-texte{
    display:block;
    font-style:italic;
    font-size:0.85rem;
    color:var(--marine-doux);
    margin-top:1px;
  }

  /* ===== Pied de page ===== */
  .pied{
    text-align:center;
    padding:18px 24px 26px;
  }

  .fleuron{
    width:64px;
    height:auto;
    margin:0 auto 10px;
    display:block;
  }

  .pied p{
    margin:0;
    font-size:0.8rem;
    letter-spacing:0.03em;
    color:var(--marine-doux);
  }

  @media (max-width:380px){
    .nom{ font-size:2.2rem; }
    .logo{ width:60px; height:60px; }
  }
</style>
</head>
