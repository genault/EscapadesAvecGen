[source: 1]<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geneviève Nault — Guide-accompagnatrice</title>

<!-- Polices : Gabriola pour le nom + EB Garamond pour le reste du texte -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Tangerine:wght@700&display=swap" rel="stylesheet">

<style>
  :root{
    --creme:      #FAF4E9;
    --creme-clair:#FFFDF8;
    --marine:     #1F3A5C;
    --marine-doux:#4E6A87;
    --coucher:    #E88A4D;
    --corail:     #E2938C;
    --or:         #C9A24B;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--creme);
    font-family:'EB Garamond', Georgia, serif;
    color:var(--marine);
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
    min-height:100vh;
  }

  /* ===== Le "billet de voyage" qui contient toute la page ===== */
  .billet{
    width:100%;
    max-width:440px;
    background:var(--creme-clair);
    border:1px solid var(--marine);
    border-radius:20px;
    overflow:hidden;
  }

  /* ===== Bandeau partenaire : logos côte à côte ===== */
  .bandeau-partenaire{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    background:var(--creme-clair);
    padding:22px 24px 18px;
    border-bottom:1px solid rgba(31,58,92,0.15);
  }

  .logo-partenaire{
    height:48px;
    width:auto;
    max-width:180px;
    object-fit:contain;
    display:block;
  }

  .logo-entete{
    height:48px;
    width:48px;
    border-radius:50%;
    border:1px solid var(--marine);
    background:var(--creme-clair);
    object-fit:cover;
    flex-shrink:0;
  }

  .separateur-logos{
    font-size:1.2rem;
    color:var(--marine-doux);
    opacity:0.5;
  }

  /* ===== En-tête : nom ===== */
  .entete{
    text-align:center;
    padding:20px 24px 12px;
  }

  .nom{
    font-family:'Gabriola','Tangerine','Segoe Script',cursive;
    font-size:3.1rem;
    line-height:1.05;
    color:var(--marine);
    margin:0;
  }

  .metier{
    display:block;
    font-family:'EB Garamond', Georgia, serif;
    font-style:italic;
    font-size:1.45rem;
    letter-spacing:0.04em;
    color:var(--marine-doux);
    margin-top:2px;
  }

  /* ===== Séparateur pointillé ===== */
  .perforation{
    border:none;
    border-top:1.5px dashed var(--marine-doux);
    opacity:0.5;
    margin:0 24px;
  }

  /* ===== Liste des liens ===== */
  .liens{
    list-style:none;
    margin:0;
    padding:8px 12px 4px;
  }

  .liens li + li .lien{
    border-top:1.5px dashed rgba(31,58,92,0.25);
  }

  .lien{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 12px;
    text-decoration:none;
    color:var(--marine);
    border-radius:14px;
    transition:background-color 0.15s ease;
    cursor:pointer;
  }

  .lien:hover,
  .lien:focus-visible{
    background:#FBEADB;
  }

  .lien:focus-visible{
    outline:2px solid var(--coucher);
    outline-offset:-2px;
  }

  .badge{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1.5px solid var(--marine);
    background:var(--creme-clair);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .badge svg{
    width:22px;
    height:22px;
  }

  .texte-lien{ min-width:0; }

  .titre-lien{
    display:block;
    font-size:1.65rem;
    font-weight:500;
    color:var(--marine);
  }

  .sous-texte{
    display:block;
    font-style:italic;
    font-size:1.25rem;
    color:var(--marine-doux);
    margin-top:1px;
  }

  /* ===== Pied de page ===== */
  .pied{
    text-align:center;
    padding:18px 24px 26px;
  }

  .pied p{
    margin:0;
    font-size:1.05rem;
    letter-spacing:0.03em;
    color:var(--marine-doux);
  }

  @media (max-width:380px){
    .nom{ font-size:2.45rem; }
    .metier{ font-size:1.25rem; }
    .titre-lien{ font-size:1.35rem; }
    .sous-texte{ font-size:1.05rem; }
    .logo-entete{ width:40px; height:40px; }
    .logo-partenaire{ height:40px; }
    .lien{ gap:12px; padding:14px 8px; }
  }
</style>
</head>
<body>

<div class="billet">

  <!-- Bandeau partenaire : Logos sur la même ligne -->
  <div class="bandeau-partenaire">
    <img class="logo-entete" src="https://raw.githubusercontent.com/genault/EscapadesAvecGen/main/Images/logo.png" alt="Logo Geneviève Nault">
    <span class="separateur-logos">—</span>
    <img class="logo-partenaire" src="https://raw.githubusercontent.com/genault/EscapadesAvecGen/main/Images/GVQ.png" alt="Groupe Voyages Québec">
  </div>

  <!-- En-tête : nom -->
  <header class="entete">
    <h1 class="nom">Geneviève Nault</h1>
    <span class="metier">Guide-accompagnatrice</span>
  </header>

  <hr class="perforation">

  <!-- Liste des liens -->
  <ul class="liens">
     <!-- 1. Facebook -->
    <li>
      <a class="lien" href="https://www.facebook.com/share/18bhv9T452/" target="_blank" rel="noopener">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </div>
        <div class="texte-lien">
          <span class="titre-lien">Facebook</span>
          <span class="sous-texte">Escapades avec Gen</span>
        </div>
      </a>
    </li>

    <!-- 2. Carte d'affaires (AVANT les coordonnées) -->
    <li>
      <a class="lien" href="https://raw.githubusercontent.com/genault/EscapadesAvecGen/main/Images/CarteAffaires.jpg" target="_blank" rel="noopener">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
        </div>
        <div class="texte-lien">
          <span class="titre-lien">Carte d'affaires</span>
          <span class="sous-texte">Afficher l'image</span>
        </div>
      </a>
    </li>

    <!-- 3. Télécharger la carte VCF / Enregistrer les coordonnées -->
    <li>
      <a class="lien" id="btn-vcf" onclick="telechargerVCF(event)">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <polyline points="17 11 19 13 23 9"/>
          </svg>
        </div>
        <div class="texte-lien">
          <span class="titre-lien">Enregistrer les coordonnées</span>
          <span class="sous-texte">Ajouter à vos contacts (vCard)</span>
        </div>
      </a>
    </li>

   
    <!-- Messenger -->
    <li>
      <a class="lien" href="https://m.me/61571934336214" target="_blank" rel="noopener">
        <div class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </div>
        <div class="texte-lien">
          <span class="titre-lien">Messenger</span>
          <span class="sous-texte">M'écrire directement</span>
        </div>
      </a>
    </li>

    
  </ul>

  <!-- Pied de page -->
  <footer class="pied">
    <p>Au plaisir de voyager ensemble !</p>
  </footer>

</div>

<!-- Script VCF ultra-compatible iPhone/Android -->
<script>
function telechargerVCF(event) {
  if(event) event.preventDefault();

  const vcardData = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:Nault;Geneviève;;;',
    'FN:Geneviève Nault',
    'ORG:Groupe Voyages Québec',
    'TITLE:Guide-accompagnatrice',
    'X-SOCIALPROFILE;type=facebook:https://www.facebook.com/share/18bhv9T452/',
    'URL:https://www.gvq.ca/',
    'NOTE:Escapades avec Gen',
    'END:VCARD'
  ].join('\r\n');

  // Utilisation du type MIME text/vcard reconnu nativement par iOS et Android
  const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
  const filename = 'Genevieve_Nault.vcf';

  // Support Internet Explorer / Edge legacy
  if (navigator.msSaveBlob) {
    navigator.msSaveBlob(blob, filename);
    return;
  }

  // Méthode standard Blob URL
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.setAttribute('download', filename);
  
  document.body.appendChild(link);
  link.click();
  
  // Nettoyage
  setTimeout(() => {
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }, 200);
}
</script>

</body>
</html>
